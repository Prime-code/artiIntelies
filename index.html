<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nova AI - Nova Crest School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nova: {
              navy: '#000b18',
              deep: '#00152a',
              gold: '#D4AF37',
              accent: '#0070f3'
            }
          },
          animation: {
            'orb-pulse': 'orbPulse 6s ease-in-out infinite',
            'fade-in': 'fadeIn 0.2s ease-out',
            'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
          },
          keyframes: {
            orbPulse: {
              '0%, 100%': { transform: 'scale(1)', opacity: '0.2' },
              '50%': { transform: 'scale(1.2)', opacity: '0.4' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Inter:wght@300;400;600;700&display=swap');
    
    body { 
      background-color: #000b18;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .mesh-gradient {
      background-image: 
        radial-gradient(at 0% 0%, hsla(210,100%,10%,1) 0, transparent 50%), 
        radial-gradient(at 100% 0%, hsla(220,100%,8%,1) 0, transparent 50%), 
        radial-gradient(at 50% 100%, hsla(215,100%,12%,1) 0, transparent 50%);
    }

    .custom-scrollbar::-webkit-scrollbar { width: 3px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.2); border-radius: 10px; }

    input:focus { outline: none; }
    
    /* Smooth mobile transitions */
    .page-transition {
      transition: transform 0.3s ease-out, opacity 0.3s ease-out;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>
<body class="mesh-gradient">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
